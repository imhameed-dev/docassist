[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docassist-backend"
version = "0.1.0"
description = "Backend for the Private AI Document Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",          # web framework
    "uvicorn>=0.30",           # ASGI server (plain, no uvloop/httptools extras: lighter)
    "pydantic-settings>=2.5",  # typed configuration from environment / .env
]

[project.optional-dependencies]
dev = [
    "pytest>=8",   # test runner
    "httpx>=0.27", # required by FastAPI's TestClient
    "ruff>=0.6",   # linter + formatter
    "mypy>=1.11",  # static type checker
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["app", "tests"]
strict = true
